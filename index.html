<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plano de estudo - Escrevente TJSP</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Verdana, Arial, sans-serif;
    background: #fdf6f0;
    color: #2c2c2a;
    margin: 0;
    padding: 16px;
    font-size: 17px;
    line-height: 1.7;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 20px 0 8px; }
  .sub { color: #5f5e5a; font-size: 14px; margin-bottom: 16px; }
  .card {
    background: #ffffff;
    border: 1px solid #e3ddd3;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .timer-display {
    font-size: 48px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 2px;
    margin: 8px 0;
  }
  .timer-label { text-align: center; font-size: 14px; color: #5f5e5a; margin-bottom: 8px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  button {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #cfc6b8;
    background: #fff;
    cursor: pointer;
    min-height: 44px;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: #7f77dd; color: #fff; border: none; }
  .btn-rest { background: #1d9e75; color: #fff; border: none; }
  .mode-pill {
    display: inline-block;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .mode-foco { background: #eeedfe; color: #26215c; }
  .mode-pausa { background: #e1f5ee; color: #04342c; }
  .progress-wrap { background: #ece5da; border-radius: 20px; height: 14px; overflow: hidden; margin: 6px 0 4px; }
  .progress-bar { background: #1d9e75; height: 100%; width: 0%; transition: width 0.3s; }
  .progress-text { font-size: 14px; color: #5f5e5a; }
  .bloco-header {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; padding: 4px 0;
  }
  .bloco-title { font-weight: bold; font-size: 16px; }
  .bloco-count { font-size: 13px; color: #5f5e5a; }
  .task-list { margin-top: 8px; display: none; }
  .task-list.open { display: block; }
  .task {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 4px; border-top: 1px solid #f0ebe2;
  }
  .task input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; }
  .task label { flex: 1; cursor: pointer; }
  .task.done label { text-decoration: line-through; color: #9a988f; }
  .today-box { background: #fff9ec; border: 1px solid #eecf8f; }
  .today-item { padding: 6px 0; font-size: 16px; }
  .arrow { font-size: 13px; color: #9a988f; }
  .hint { font-size: 13px; color: #5f5e5a; margin-top: 6px; }
</style>
</head>
<body>

<h1>Plano de estudo — Escrevente Técnico Judiciário (TJSP)</h1>
<p class="sub">Blocos curtos, metas pequenas, sem culpa nas pausas.</p>

<div class="card">
  <div class="progress-text" id="progress-text">0 de 0 tarefas concluídas</div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
</div>

<div class="card today-box">
  <h2 style="margin-top:0;">O que estudar agora</h2>
  <div id="today-list"><p class="hint">Toque no botão para receber 2 tarefas pequenas.</p></div>
  <div class="btn-row">
    <button class="btn-primary" onclick="sugerirHoje()">Me dá 2 tarefas de hoje</button>
  </div>
</div>

<div class="card">
  <h2 style="margin-top:0; text-align:center;">Timer de estudo</h2>
  <div class="mode-pill mode-foco" id="mode-pill">Foco</div>
  <div class="timer-display" id="timer-display">15:00</div>
  <div class="timer-label" id="timer-label">Escolha um tempo e comece quando estiver pronta</div>
  <div class="btn-row">
    <button onclick="setDuration(10)">10 min</button>
    <button onclick="setDuration(15)">15 min</button>
    <button onclick="setDuration(20)">20 min</button>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="start-btn" onclick="toggleTimer()">Começar</button>
    <button onclick="resetTimer()">Reiniciar</button>
  </div>
  <div class="btn-row">
    <button class="btn-rest" onclick="modoDescanso()">Preciso descansar agora</button>
  </div>
  <div class="hint" id="rest-msg"></div>
</div>

<div id="blocos"></div>

<script>
const data = {
  "Bloco I - Língua Portuguesa": [
    "Ler um texto curto e responder: qual é a ideia principal?",
    "Achar sinônimos e antônimos de 5 palavras de um texto",
    "Ver 5 exemplos de sentido próprio x sentido figurado",
    "Revisar classes de palavras (substantivo, adjetivo, verbo) com 10 frases",
    "Praticar concordância verbal com 10 frases",
    "Praticar concordância nominal com 10 frases",
    "Praticar regência verbal e nominal com exemplos",
    "Praticar colocação pronominal (onde colocar o 'se', 'me', 'lhe')",
    "Revisar crase com 10 frases práticas",
    "Revisar pontuação (vírgula, ponto e vírgula) com exemplos",
    "Fazer 10 questões de interpretação de texto",
    "Fazer 10 questões sobre coesão e coerência textual",
    "Revisão geral: fazer uma prova simulada curta de português"
  ],
  "Bloco II - Direito Penal": [
    "Ler artigos 293 a 305 do Código Penal (falsificação de documentos)",
    "Ler artigos 307, 308 e 311-A (falsa identidade, fraude em concurso)",
    "Ler artigos 312 a 317 (crimes contra a administração pública)",
    "Ler artigos 319 a 333 (crimes de funcionário público)",
    "Ler artigos 336, 337 e 339 a 347 (crimes contra a fé pública)",
    "Ler artigos 357 e 359",
    "Fazer um resumo em áudio ou desenho dos crimes mais importantes"
  ],
  "Bloco II - Direito Processual Penal": [
    "Ler artigos 251 a 258 e 261 a 267 do CPP",
    "Ler artigo 274 e artigos 351 a 372",
    "Ler artigos 394 a 497 (procedimento comum e júri)",
    "Ler artigos 531 a 548",
    "Ler artigos 574 a 667 (recursos)",
    "Ler Lei 9.099/95, artigos 60 a 83 (Juizados Especiais Criminais)",
    "Ler Lei 9.099/95, artigos 88 e 89"
  ],
  "Bloco II - Direito Processual Civil": [
    "Ler artigos 144 a 155 do CPC (impedimento e suspeição)",
    "Ler artigos 188 a 275 do CPC",
    "Ler artigos 294 a 311 (tutela provisória)",
    "Ler artigos 318 a 538 (procedimento comum)",
    "Ler artigos 994 a 1026 (recursos)",
    "Ler Lei 9.099/95, artigos 3 a 19 (Juizados Especiais Cíveis)",
    "Ler Lei 12.153/2009 (Juizados da Fazenda Pública)"
  ],
  "Bloco II - Direito Constitucional e Administrativo": [
    "Ler Constituição Federal - Título II, Capítulos I, II e III",
    "Ler Constituição Federal - Título III, Capítulo VII, Seções I e II",
    "Ler artigo 92 da Constituição Federal",
    "Ler Lei 10.261/68 (Estatuto dos Funcionários Públicos SP), artigos 239 a 323",
    "Ler Lei 8.429/92 (Lei de Improbidade Administrativa)"
  ],
  "Bloco II - Normas da Corregedoria": [
    "Ler Tomo I, Capítulo II, Seção I (subseções I e II)",
    "Ler Tomo I, Capítulo III, Seções I, II, V, VI, VII",
    "Ler Tomo I, Capítulo III, Seção VIII (subseções I, II, III)",
    "Ler Tomo I, Capítulo III, Seções IX a XV e XVII a XIX",
    "Ler Tomo I, Capítulo XI, Seções I, IV e V",
    "Ler Tomo I, Capítulo XI, Seção VI (subseções I, III, V, XIII)"
  ],
  "Bloco III - Atualidades e Estatuto da Pessoa com Deficiência": [
    "Acompanhar notícias da semana (política, economia, sociedade)",
    "Ler artigos 1 a 13 da Lei 13.146/2015 (Estatuto da Pessoa com Deficiência)",
    "Ler artigos 34 a 38 da mesma lei"
  ],
  "Bloco III - Matemática": [
    "Praticar operações com números reais",
    "Praticar MMC e MDC com exercícios simples",
    "Praticar razão e proporção",
    "Praticar porcentagem com exemplos do dia a dia",
    "Praticar regra de três simples e composta",
    "Praticar média aritmética simples e ponderada",
    "Praticar juros simples",
    "Praticar equação do 1º grau",
    "Praticar equação do 2º grau",
    "Praticar sistema de equações do 1º grau",
    "Praticar leitura de tabelas e gráficos",
    "Revisar sistemas de medidas usuais",
    "Praticar geometria básica (perímetro, área, volume, Pitágoras)"
  ],
  "Bloco III - Informática": [
    "Praticar Windows: pastas, arquivos, área de trabalho",
    "Praticar Word: formatação de texto, tabelas, cabeçalhos",
    "Praticar Excel: fórmulas e funções básicas",
    "Praticar Excel: gráficos e classificação de dados",
    "Revisar uso de e-mail e internet (URL, links, busca)",
    "Revisar Teams e OneDrive (reuniões, compartilhamento de arquivos)"
  ],
  "Bloco III - Raciocínio Lógico": [
    "Praticar 5 questões de sequências numéricas",
    "Praticar 5 questões de lógica de argumentação",
    "Praticar 5 questões de diagramas lógicos",
    "Praticar 5 questões de estruturas lógicas (relações entre pessoas, lugares, coisas)"
  ]
};

let state = {};

async function carregar() {
  try {
    const r = await window.storage.get('tjsp-progresso', false);
    if (r && r.value) state = JSON.parse(r.value);
  } catch (e) { state = {}; }
  montarBlocos();
  atualizarProgresso();
}

async function salvar() {
  try { await window.storage.set('tjsp-progresso', JSON.stringify(state), false); }
  catch (e) {}
}

function montarBlocos() {
  const container = document.getElementById('blocos');
  container.innerHTML = '';
  Object.keys(data).forEach((bloco, bi) => {
    const tarefas = data[bloco];
    const card = document.createElement('div');
    card.className = 'card';
    const feitos = tarefas.filter((_, ti) => state[bloco + '|' + ti]).length;
    card.innerHTML = `
      <div class="bloco-header" onclick="toggleBloco(${bi})">
        <div>
          <div class="bloco-title">${bloco}</div>
          <div class="bloco-count">${feitos} de ${tarefas.length} feitas</div>
        </div>
        <div class="arrow" id="arrow-${bi}">tocar para abrir</div>
      </div>
      <div class="task-list" id="list-${bi}"></div>
    `;
    container.appendChild(card);
    const list = card.querySelector('#list-' + bi);
    tarefas.forEach((t, ti) => {
      const key = bloco + '|' + ti;
      const done = !!state[key];
      const div = document.createElement('div');
      div.className = 'task' + (done ? ' done' : '');
      div.innerHTML = `
        <input type="checkbox" id="chk-${bi}-${ti}" ${done ? 'checked' : ''}>
        <label for="chk-${bi}-${ti}">${t}</label>
      `;
      list.appendChild(div);
      div.querySelector('input').addEventListener('change', (e) => {
        state[key] = e.target.checked;
        div.classList.toggle('done', e.target.checked);
        salvar();
        atualizarProgresso();
        atualizarContagemBloco(bi, bloco, tarefas);
      });
    });
  });
}

function atualizarContagemBloco(bi, bloco, tarefas) {
  const feitos = tarefas.filter((_, ti) => state[bloco + '|' + ti]).length;
  document.querySelectorAll('.bloco-count')[bi].textContent = feitos + ' de ' + tarefas.length + ' feitas';
}

function toggleBloco(bi) {
  const list = document.getElementById('list-' + bi);
  const arrow = document.getElementById('arrow-' + bi);
  const open = list.classList.toggle('open');
  arrow.textContent = open ? 'tocar para fechar' : 'tocar para abrir';
}

function atualizarProgresso() {
  let total = 0, feitos = 0;
  Object.keys(data).forEach(bloco => {
    data[bloco].forEach((_, ti) => {
      total++;
      if (state[bloco + '|' + ti]) feitos++;
    });
  });
  document.getElementById('progress-text').textContent = feitos + ' de ' + total + ' tarefas concluídas';
  const pct = total ? Math.round((feitos / total) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function sugerirHoje() {
  const pendentes = [];
  Object.keys(data).forEach(bloco => {
    data[bloco].forEach((t, ti) => {
      if (!state[bloco + '|' + ti]) pendentes.push({bloco, t});
    });
  });
  if (pendentes.length === 0) {
    document.getElementById('today-list').innerHTML = '<p>Você concluiu tudo! Hora de revisar o que já estudou.</p>';
    return;
  }
  const escolhidos = [];
  const copia = [...pendentes];
  const n = Math.min(2, copia.length);
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.random() * copia.length);
    escolhidos.push(copia.splice(idx, 1)[0]);
  }
  document.getElementById('today-list').innerHTML = escolhidos.map(e =>
    `<div class="today-item"><strong>${e.bloco}</strong><br>${e.t}</div>`
  ).join('');
}

let duracao = 15 * 60;
let restante = duracao;
let rodando = false;
let intervalId = null;
let emPausa = false;

function formatar(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const ss = (s % 60).toString().padStart(2, '0');
  return m + ':' + ss;
}

function setDuration(min) {
  if (rodando) return;
  duracao = min * 60;
  restante = duracao;
  document.getElementById('timer-display').textContent = formatar(restante);
  document.getElementById('timer-label').textContent = 'Pronta para ' + min + ' minutos de foco?';
}

function toggleTimer() {
  if (rodando) {
    pausarTimer();
  } else {
    iniciarTimer();
  }
}

function iniciarTimer() {
  rodando = true;
  emPausa = false;
  document.getElementById('mode-pill').textContent = 'Foco';
  document.getElementById('mode-pill').className = 'mode-pill mode-foco';
  document.getElementById('start-btn').textContent = 'Pausar';
  document.getElementById('timer-label').textContent = 'Foco em andamento, você consegue';
  intervalId = setInterval(() => {
    restante--;
    document.getElementById('timer-display').textContent = formatar(restante);
    if (restante <= 0) {
      clearInterval(intervalId);
      rodando = false;
      document.getElementById('start-btn').textContent = 'Começar';
      document.getElementById('timer-label').textContent = 'Tempo terminou! Faça uma pausa de 5 minutos.';
      document.getElementById('mode-pill').textContent = 'Hora da pausa';
      document.getElementById('mode-pill').className = 'mode-pill mode-pausa';
    }
  }, 1000);
}

function pausarTimer() {
  clearInterval(intervalId);
  rodando = false;
  document.getElementById('start-btn').textContent = 'Continuar';
  document.getElementById('timer-label').textContent = 'Pausado. Continue quando quiser.';
}

function resetTimer() {
  clearInterval(intervalId);
  rodando = false;
  restante = duracao;
  document.getElementById('timer-display').textContent = formatar(restante);
  document.getElementById('start-btn').textContent = 'Começar';
  document.getElementById('timer-label').textContent = 'Escolha um tempo e comece quando estiver pronta';
  document.getElementById('mode-pill').textContent = 'Foco';
  document.getElementById('mode-pill').className = 'mode-pill mode-foco';
}

function modoDescanso() {
  clearInterval(intervalId);
  rodando = false;
  document.getElementById('start-btn').textContent = 'Começar';
  document.getElementById('rest-msg').textContent = 'Tudo bem. Descansar agora faz parte do plano. Volte quando se sentir pronta.';
  document.getElementById('mode-pill').textContent = 'Descansando';
  document.getElementById('mode-pill').className = 'mode-pill mode-pausa';
}

carregar();
</script>

</body>
</html>
