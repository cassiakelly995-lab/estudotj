<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    getDocs, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD5B5y-djVnB2a9YrAyMbr4USiaGpuqz5s",
    authDomain: "planodeetudotjsp.firebaseapp.com",
    projectId: "planodeetudotjsp",
    storageBucket: "planodeetudotjsp.firebasestorage.app",
    messagingSenderId: "931416558905",
    appId: "1:931416558905:web:4ebac550dfc2187cd52ce8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function notasRef(blocoId) {
    return collection(db, 'anotacoes', blocoId, 'notas');
  }

  window.adicionarNota = async function(blocoId) {
    const tituloEl = document.getElementById('nota-titulo-' + blocoId);
    const textoEl = document.getElementById('nota-input-' + blocoId);
    const status = document.getElementById('nota-status-' + blocoId);
    const titulo = tituloEl.value.trim();
    const texto = textoEl.value.trim();
    if (!titulo && !texto) {
      status.textContent = 'Escreva um título ou um texto antes de salvar.';
      return;
    }
    status.textContent = 'Salvando...';
    try {
      await addDoc(notasRef(blocoId), {
        titulo: titulo || 'Sem título',
        texto: texto,
        criadoEm: serverTimestamp()
      });
      tituloEl.value = '';
      textoEl.value = '';
      status.textContent = 'Anotação salva!';
      await window.carregarNotas(blocoId);
    } catch (e) {
      status.textContent = 'Erro ao salvar: ' + e.message;
    }
  };

  window.apagarNota = async function(blocoId, notaId) {
    try {
      await deleteDoc(doc(db, 'anotacoes', blocoId, 'notas', notaId));
      await window.carregarNotas(blocoId);
    } catch (e) {}
  };

  window.carregarNotas = async function(blocoId) {
    const lista = document.getElementById('notas-lista-' + blocoId);
    if (!lista) return;
    lista.innerHTML = '<p class="hint">Carregando...</p>';
    try {
      const q = query(notasRef(blocoId), orderBy('criadoEm', 'desc'));
      const snap = await getDocs(q);
      if (snap.empty) {
        lista.innerHTML = '<p class="hint">Nenhuma anotação ainda neste bloco.</p>';
        return;
      }
      lista.innerHTML = '';
      const caderno = document.createElement('div');
      caderno.className = 'caderno';
      snap.forEach(d => {
        const item = d.data();
        const data = item.criadoEm && item.criadoEm.toDate ? item.criadoEm.toDate() : new Date();
        const dataFmt = data.toLocaleDateString('pt-BR') + ' às ' + data.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        const pagina = document.createElement('div');
        pagina.className = 'pagina-caderno';
        pagina.innerHTML = `
          <div class="titulo"></div>
          <div class="texto"></div>
          <div class="meta">
            <span>${dataFmt}</span>
            <button class="btn-danger" onclick="apagarNota('${blocoId}','${d.id}')">Apagar</button>
          </div>
        `;
        pagina.querySelector('.titulo').textContent = item.titulo || 'Sem título';
        pagina.querySelector('.texto').textContent = item.texto || '';
        caderno.appendChild(pagina);
      });
      lista.appendChild(caderno);
    } catch (e) {
      lista.innerHTML = '<p class="hint">Erro ao carregar: ' + e.message + '</p>';
    }
  };
</script>

  ]

let state = {};
let abaAtiva = null;

function slug(txt) {
  return txt.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

function carregar() {
  try {
    const raw = localStorage.getItem('tjsp-progresso');
    if (raw) state = JSON.parse(raw);
  } catch (e) { state = {}; }
  montarTabs();
  montarPaginas();
  atualizarProgresso();
  const primeiraChave = Object.keys(data)[0];
  abrirAba(slug(primeiraChave));
}

function salvar() {
  try { localStorage.setItem('tjsp-progresso', JSON.stringify(state)); }
  catch (e) {}
}

function montarTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  Object.keys(data).forEach(bloco => {
    const id = slug(bloco);
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.id = 'tab-' + id;
    btn.textContent = bloco;
    btn.onclick = () => abrirAba(id);
    tabs.appendChild(btn);
  });
}

function montarPaginas() {
  const pages = document.getElementById('pages');
  pages.innerHTML = '';
  Object.keys(data).forEach(bloco => {
    const id = slug(bloco);
    const tarefas = data[bloco];
    const page = document.createElement('div');
    page.className = 'page';
    page.id = 'page-' + id;
    const feitos = tarefas.filter((_, ti) => state[bloco + '|' + ti]).length;
    page.innerHTML = `
      <div class="bloco-card">
        <h2>${bloco}</h2>
        <div class="bloco-count" id="count-${id}">${feitos} de ${tarefas.length} feitas</div>
        <div id="fontes-${id}"></div>
        <div id="tasks-${id}"></div>
        <div class="notas-section">
          <h2>Meu caderno de anotações</h2>
          <div class="nota-form">
            <input type="text" id="nota-titulo-${id}" placeholder="Título da anotação">
            <textarea id="nota-input-${id}" placeholder="Escreva aqui..."></textarea>
            <div class="btn-row" style="margin-top:8px;">
              <button class="btn-save" onclick="adicionarNota('${id}')">Adicionar ao caderno</button>
            </div>
            <div class="nota-status" id="nota-status-${id}"></div>
          </div>
          <div id="notas-lista-${id}"></div>
        </div>
      </div>
    `;
    pages.appendChild(page);
    if (fontes[bloco]) {
      const fontesDiv = page.querySelector('#fontes-' + id);
      fontesDiv.innerHTML = '<div class="hint" style="margin-bottom:10px;">Fontes oficiais: ' +
        fontes[bloco].map(f => `<a href="${f.url}" target="_blank" rel="noopener">${f.label}</a>`).join(' &middot; ') +
        '</div>';
    }
    const list = page.querySelector('#tasks-' + id);
    tarefas.forEach((t, ti) => {
      const key = bloco + '|' + ti;
      const done = !!state[key];
      const div = document.createElement('div');
      div.className = 'task' + (done ? ' done' : '');
      div.innerHTML = `
        <input type="checkbox" id="chk-${id}-${ti}" ${done ? 'checked' : ''}>
        <label for="chk-${id}-${ti}">${t}</label>
      `;
      list.appendChild(div);
      div.querySelector('input').addEventListener('change', (e) => {
        state[key] = e.target.checked;
        div.classList.toggle('done', e.target.checked);
        salvar();
        atualizarProgresso();
        const novosFeitos = tarefas.filter((_, i2) => state[bloco + '|' + i2]).length;
        document.getElementById('count-' + id).textContent = novosFeitos + ' de ' + tarefas.length + ' feitas';
      });
    });
  });
}

function abrirAba(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  document.getElementById('page-' + id).classList.add('active');
  abaAtiva = id;
  if (window.carregarNotas) window.carregarNotas(id);
}

function atualizarProgresso() {
  let total = 0, feitos = 0;
  Object.keys(data).forEach(bloco => {
    data[bloco].forEach((_, ti) => {
      total++;
      if (state[bloco + '|' + ti]) feitos++;
    });
  });
  document.getElementById('progress-text').textContent = feitos + ' de ' + total + ' tarefas concluídas';
  const pct = total ? Math.round((feitos / total) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function sugerirHoje() {
  const pendentes = [];
  Object.keys(data).forEach(bloco => {
    data[bloco].forEach((t, ti) => {
      if (!state[bloco + '|' + ti]) pendentes.push({bloco, t});
    });
  });
  if (pendentes.length === 0) {
    document.getElementById('today-list').innerHTML = '<p>Você concluiu tudo! Hora de revisar o que já estudou.</p>';
    return;
  }
  const escolhidos = [];
  const copia = [...pendentes];
  const n = Math.min(2, copia.length);
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.random() * copia.length);
    escolhidos.push(copia.splice(idx, 1)[0]);
  }
  document.getElementById('today-list').innerHTML = escolhidos.map(e =>
    `<div class="today-item"><strong>${e.bloco}</strong><br>${e.t}</div>`
  ).join('');
}

let duracao = 15 * 60;
let restante = duracao;
let rodando = false;
let intervalId = null;

function formatar(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const ss = (s % 60).toString().padStart(2, '0');
  return m + ':' + ss;
}

function setDuration(min) {
  if (rodando) return;
  duracao = min * 60;
  restante = duracao;
  document.getElementById('timer-display').textContent = formatar(restante);
  document.getElementById('timer-label').textContent = 'Pronta para ' + min + ' minutos de foco?';
}

function toggleTimer() {
  if (rodando) { pausarTimer(); } else { iniciarTimer(); }
}

function iniciarTimer() {
  rodando = true;
  document.getElementById('mode-pill').textContent = 'Foco';
  document.getElementById('mode-pill').className = 'mode-pill mode-foco';
  document.getElementById('start-btn').textContent = 'Pausar';
  document.getElementById('timer-label').textContent = 'Foco em andamento, você consegue';
  intervalId = setInterval(() => {
    restante--;
    document.getElementById('timer-display').textContent = formatar(restante);
    if (restante <= 0) {
      clearInterval(intervalId);
      rodando = false;
      document.getElementById('start-btn').textContent = 'Começar';
      document.getElementById('timer-label').textContent = 'Tempo terminou! Faça uma pausa de 5 minutos.';
      document.getElementById('mode-pill').textContent = 'Hora da pausa';
      document.getElementById('mode-pill').className = 'mode-pill mode-pausa';
    }
  }, 1000);
}

function pausarTimer() {
  clearInterval(intervalId);
  rodando = false;
  document.getElementById('start-btn').textContent = 'Continuar';
  document.getElementById('timer-label').textContent = 'Pausado. Continue quando quiser.';
}

function resetTimer() {
  clearInterval(intervalId);
  rodando = false;
  restante = duracao;
  document.getElementById('timer-display').textContent = formatar(restante);
  document.getElementById('start-btn').textContent = 'Começar';
  document.getElementById('timer-label').textContent = 'Escolha um tempo e comece quando estiver pronta';
  document.getElementById('mode-pill').textContent = 'Foco';
  document.getElementById('mode-pill').className = 'mode-pill mode-foco';
}

function modoDescanso() {
  clearInterval(intervalId);
  rodando = false;
  document.getElementById('start-btn').textContent = 'Começar';
  document.getElementById('rest-msg').textContent = 'Tudo bem. Descansar agora faz parte do plano. Volte quando se sentir pronta.';
  document.getElementById('mode-pill').textContent = 'Descansando';
  document.getElementById('mode-pill').className = 'mode-pill mode-pausa';
}

carregar();
</script>
